[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coxyz-cli"
dynamic = ["version"]
description = "CLI to manage Docker services under /srv/docker (ownership, permissions, ACLs)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "coxyz" }]
keywords = ["docker", "acl", "permissions", "cli", "sysadmin"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
release = ["bump-my-version>=0.20"]

[project.urls]
Homepage = "https://github.com/Ekyoz/Coxyz-CLI"
Repository = "https://github.com/Ekyoz/Coxyz-CLI"
Issues = "https://github.com/Ekyoz/Coxyz-CLI/issues"

[project.scripts]
coxyz = "coxyz.cli:app"

[tool.setuptools.dynamic]
version = { attr = "coxyz.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coxyz = ["default_config.yaml"]

# `make release` drives this: bumps the version, commits, and creates a vX.Y.Z
# tag. Pushing that tag triggers .github/workflows/publish.yml → PyPI.
[tool.bumpversion]
current_version = "0.3.3"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"

[[tool.bumpversion.files]]
filename = "src/coxyz/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
