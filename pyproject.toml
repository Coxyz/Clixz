[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clixz"
dynamic = ["version"]
description = "CLI to inventory, check and create the Docker services under /srv/docker"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "clixz" }]
keywords = ["docker", "compose", "permissions", "cli", "sysadmin", "homelab"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
release = ["bump-my-version>=0.20"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Coxyz/Clixz"
Repository = "https://github.com/Coxyz/Clixz"
Issues = "https://github.com/Coxyz/Clixz/issues"

[project.scripts]
clixz = "clixz.cli:app"
# Unprivileged gateway for the MCP container. Installed as a console script so
# its code lands under the root-owned venv: the ExecStart target cannot be
# rewritten by an application group.
clixz-mcpd = "clixz.mcpd:main"
# The per-request root applier, started by clixz-apply.socket. Same reasoning:
# a console script under the root-owned venv, reached through /usr/local/bin.
clixz-apply = "clixz.applyd:main"

[tool.setuptools.dynamic]
version = { attr = "clixz.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clixz = ["default_config.yaml", "default_lint.yaml", "default_ignore.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# The CLI turns an exception into a message and `raise typer.Exit(1)`; chaining
# the cause there would only add a traceback nobody is shown.
ignore = ["B904"]

# `make release` drives this: bumps the version, commits, and creates a vX.Y.Z
# tag, then publishes a GitHub release on it. The release triggers
# .github/workflows/publish.yml → PyPI.
[tool.bumpversion]
current_version = "2.2.3"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"

[[tool.bumpversion.files]]
filename = "src/clixz/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
