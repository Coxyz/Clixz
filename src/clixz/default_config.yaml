# clixz configuration — default. Override at /etc/clixz/config.yaml.
#
# v2 enforces ownership and modes, and nothing else. There are no ACL
# principals. Komodo Periphery, which used one to read the compose files, needs
# `cap_add: [DAC_OVERRIDE]` in its own compose instead (it runs as root, but
# with cap_drop: ALL); code-server, the other consumer, is not deployed.
# `clixz config --migrate` translates a v1 config into this shape.

root_dir: /srv/docker

# Paths to skip during audit and repair (glob patterns).
exclude: []

# Each category owns its subtree through a dedicated system account. This is
# what keeps a compromised non-root container in one category out of another's
# data — the only isolation that survives an attacker already on the host.
categories:
  apps:        { user: svc_apps,        group: svc_apps }
  automation:  { user: svc_automation,  group: svc_automation }
  infra:       { user: svc_infra,       group: svc_infra }
  monitoring:  { user: svc_monitoring,  group: svc_monitoring }
  network:     { user: svc_network,     group: svc_network }

# Three rules, applied to a fixed skeleton:
#   dir   category/, service/, config/, data/   (contents are never touched)
#   file  compose.yaml, service.yaml
#   env   .env
rules:
  dir:
    mode: "750"
  file:
    mode: "640"
  env:
    mode: "600"
    # root:root, not the category account: a container running as the category
    # user must not be able to read the secrets it is handed by the daemon.
    owner: "root:root"

# `clixz manifest` aggregates the public service.yaml descriptors into
# manifest.json, next to this file. It describes the whole tree, so it does not
# live inside one service: the container that serves it mounts it from here,
# read-only. Uncomment to put it somewhere else.
# api:
#   manifest: /etc/clixz/manifest.json

# Self-built image build contexts (Dockerfile + sources), one directory each.
# Scaffolded by `clixz image add`; ownership is not audited.
images:
  dir: /opt/images

# Git checkouts, one directory each. Created by `clixz repo add`, listed by
# `clixz repo ls`; ownership is not audited.
repos:
  dir: /opt/repos

# `clixz exposed` reads this database to compare what the reverse proxy
# actually publishes against what the service descriptors declare. Read-only,
# and it needs root. `sudo clixz exposed --snapshot` copies the proxy hosts to
# npm-hosts.json, next to this file, so that an unprivileged reader (clixz-mcpd)
# gets the same answer without being given the database.
npm:
  database: /srv/docker/network/npm/data/app/database.sqlite
  # snapshot: /etc/clixz/npm-hosts.json

# The compose rules and the accepted exceptions are not in this file: see
# lint.yaml and ignore.yaml next to it (`clixz rules`).
