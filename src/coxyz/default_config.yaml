# Default configuration for coxyz CLI
# Override location: /etc/coxyz/config.yaml (or --config FILE)

root_dir: /srv/docker

# Paths to ignore during audit and apply (glob patterns).
# Examples: "*.bak", "*/do_not_touch/", "apps/legacy/*"
exclude: []

settings:
  principals:
    komodo:
      name: komodo_runner
      kind: group              # "group" or "user"
    boxyz_dev:
      name: boxyz_dev
      kind: group              # group code-server runs as (for `coxyz dev`)

# Authorized categories and their owning service account.
# Format: <category>: { user: <svc_user>, group: <svc_group> }
categories:
  apps:
    user: svc_apps
    group: svc_apps
  automation:
    user: svc_automation
    group: svc_automation
  monitoring:
    user: svc_monitoring
    group: svc_monitoring
  network:
    user: svc_network
    group: svc_network

# Rules applied to each path kind.
# - mode: octal mode as string (e.g. "750")
# - acl:  per-principal ACL perms ("rx", "rw", "rwx", "x") or null to skip
# - owner: optional "user:group" override (default: category owner)
# - audit_only: if true, never modify; just report drift
rules:
  category_dir:
    mode: "750"
    acl:
      komodo: "rx"

  service_dir:
    mode: "750"
    acl:
      komodo: "rx"

  compose_file:
    mode: "660"
    acl:
      komodo: "rw"

  # service.yaml — dashboard descriptor (non-sensitive presentation metadata).
  service_file:
    mode: "640"
    acl: null

  config_dir:
    mode: "750"
    acl:
      komodo: "x"

  data_dir:
    mode: "750"
    acl: null
    audit_only: true

  env_file:
    mode: "600"
    owner: "root:root"
    acl: null
    audit_only: true

# `coxyz manifest` aggregates every service.yaml into this JSON file, mounted
# read-only into the coxyz-api container and served at /api/services.
api:
  manifest: /srv/docker/apps/api/data/manifest.json

# Self-built image build contexts (Dockerfile + sources), one dir per image.
# `coxyz image add/remove/list` manages them; `check`/`apply` enforce owner/mode.
# Owned by the dev principal (editable via code-server), world-readable so
# Komodo Periphery can read the build context to build.
# - acl: optional per-principal ACL on each subdirectory (same form as rules),
#        or null/omitted to skip. Example below grants komodo read+exec.
# - dockerfile: optional rule (mode/owner/acl) for the Dockerfile inside each
#        image dir. When set, `image add` applies it and `check`/`apply` enforce
#        it; when omitted the Dockerfile keeps mode 664 and is not audited.
images:
  dir: /opt/images
  owner: "boxyz_dev:boxyz_dev"
  mode: "775"
  acl: null
  # acl:
  #   komodo: "rx"
  # dockerfile:
  #   mode: "664"
  #   acl:
  #     komodo: "r"

# Source repositories (same convention as images).
repos:
  dir: /opt/repos
  owner: "boxyz_dev:boxyz_dev"
  mode: "775"
  acl: null
  # acl:
  #   komodo: "rx"

# `coxyz dev add/remove <service>`: mount a service's config/ and data/ into
# code-server and grant the `principal` group recursive rw access on them.
dev:
  compose: /srv/docker/apps/code-boxyz/compose.yaml   # code-server compose to edit
  principal: boxyz_dev                                 # key in settings.principals
  perms: rwx                                           # granted recursively (x -> X)
  mount_base: /workspace/services                      # in-container mount prefix
